<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Song Request Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #panel {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 380px;
  }
  .now-playing {
    background: linear-gradient(135deg, rgba(30, 30, 30, 0.85), rgba(20, 20, 20, 0.85));
    border-left: 4px solid #ff2d55;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    animation: slideIn 0.4s ease;
  }
  .now-playing .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .now-playing .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ff2d55;
    font-weight: 700;
  }
  .now-playing .requester-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 45, 85, 0.15);
    border: 1px solid rgba(255, 45, 85, 0.4);
    border-radius: 999px;
    padding: 3px 10px 3px 6px;
  }
  .now-playing .requester-badge .avatar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ff2d55;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .now-playing .requester-badge .name {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .now-playing .title {
    font-size: 19px;
    font-weight: 700;
    margin-top: 6px;
  }
  .now-playing .artist {
    font-size: 13px;
    color: #ccc;
  }
  .now-playing .status {
    font-size: 11px;
    color: #4caf50;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .now-playing .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4caf50;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  #audio-player {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    z-index: -999;
  }
  
  .queue-item {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 6px;
    padding: 7px 12px;
    margin-bottom: 4px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideIn 0.3s ease;
  }
  .queue-item .song-info { display: flex; align-items: center; min-width: 0; }
  .queue-item .pos { color: #888; margin-right: 8px; flex-shrink: 0; }
  .queue-item .song-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .queue-item .requester {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255, 45, 85, 0.18);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .empty {
    font-size: 13px;
    color: #999;
    font-style: italic;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div id="panel">
    <div id="content"><div class="empty">Belum ada request lagu...</div></div>
  </div>
  
  <audio id="audio-player" preload="auto"></audio>

  <script>
    const content = document.getElementById('content');
    const audioPlayer = document.getElementById('audio-player');
    let currentSong = null;
    let isPlaying = false;
    let audioContext = null;

    // Auth token
    const authToken = new URLSearchParams(location.search).get('key') || '';

    // === ULTIMATE AUTOPLAY FIX ===
    function unlockAudio() {
      // Method 1: Create silent AudioContext to unlock audio
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          // Create silent buffer and play it
          const buffer = audioContext.createBuffer(1, 1, 22050);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start(0);
          console.log('✅ AudioContext unlocked');
        }
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume().then(() => {
            console.log('✅ AudioContext resumed');
          });
        }
      } catch (e) {
        console.log('AudioContext error:', e);
      }

      // Method 2: Try to play audio element
      if (audioPlayer.src && audioPlayer.paused) {
        audioPlayer.muted = true;
        audioPlayer.play().then(() => {
          audioPlayer.muted = false;
          isPlaying = true;
          console.log('✅ Audio playing (unlocked)');
        }).catch(() => {
          // Method 3: Fallback - reload and try again
          audioPlayer.load();
          setTimeout(() => {
            audioPlayer.muted = true;
            audioPlayer.play().then(() => {
              audioPlayer.muted = false;
              isPlaying = true;
              console.log('✅ Audio playing (reloaded)');
            }).catch(() => {});
          }, 500);
        });
      }
    }

    function playAudio(videoId) {
      if (!videoId) return;
      
      const baseUrl = `${window.location.protocol}//${window.location.host}`;
      const streamUrl = `${baseUrl}/api/stream?videoId=${videoId}&key=${encodeURIComponent(authToken)}`;
      
      // Set source
      audioPlayer.src = streamUrl;
      audioPlayer.load();
      
      // Unlock and play
      setTimeout(() => {
        unlockAudio();
      }, 200);
      
      // Auto-advance when song ends
      audioPlayer.onended = () => {
        console.log('⏭️ Song ended, advancing...');
        isPlaying = false;
        fetch(`/api/advance?key=${encodeURIComponent(authToken)}`, { method: 'POST' })
          .catch(() => {});
      };
      
      // Handle errors
      audioPlayer.onerror = (e) => {
        console.error('❌ Audio error:', e);
        setTimeout(() => {
          if (!isPlaying) {
            unlockAudio();
          }
        }, 1000);
      };
    }

    function render(queue) {
      if (!queue || queue.length === 0) {
        content.innerHTML = '<div class="empty">Belum ada request lagu... ketik !play judul lagu</div>';
        audioPlayer.pause();
        audioPlayer.src = '';
        isPlaying = false;
        return;
      }

      const [current, ...upNext] = queue;
      currentSong = current;
      
      const currentRequester = current.requestedBy || '';
      let html = `
        <div class="now-playing">
          <div class="top-row">
            <div class="label">🎵 Now Playing</div>
            ${currentRequester ? `
              <div class="requester-badge">
                <span class="avatar">${escapeHtml(currentRequester.charAt(0).toUpperCase())}</span>
                <span class="name">@${escapeHtml(currentRequester)}</span>
              </div>
            ` : ''}
          </div>
          <div class="title">${escapeHtml(current.title)}</div>
          <div class="artist">${escapeHtml(current.artist)}</div>
          <div class="status">
            <span class="dot"></span>
            Streaming from server
          </div>
        </div>
      `;

      upNext.slice(0, 5).forEach((song, i) => {
        html += `
          <div class="queue-item">
            <span class="song-info"><span class="pos">#${i + 1}</span><span class="song-text">${escapeHtml(song.title)} — ${escapeHtml(song.artist)}</span></span>
            <span class="requester">👤 @${escapeHtml(song.requestedBy)}</span>
          </div>
        `;
      });

      content.innerHTML = html;

      // Play audio if videoId exists
      if (current.videoId) {
        const currentSrc = audioPlayer.src;
        const newSrc = `${window.location.protocol}//${window.location.host}/api/stream?videoId=${current.videoId}&key=${encodeURIComponent(authToken)}`;
        
        if (!currentSrc.includes(current.videoId) || audioPlayer.paused) {
          playAudio(current.videoId);
        }
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function connect() {
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProtocol}//${location.host}/ws?key=${encodeURIComponent(authToken)}`);
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        render(data.queue);
      };
      
      ws.onclose = () => {
        setTimeout(connect, 2000);
      };
    }

    // === MULTIPLE AUTOPLAY TRIGGERS ===

    // 1. On load
    window.addEventListener('load', () => {
      console.log('📄 Page loaded');
      setTimeout(unlockAudio, 300);
    });

    // 2. On click anywhere
    document.addEventListener('click', () => {
      unlockAudio();
    });

    // 3. On touch
    document.addEventListener('touchstart', () => {
      unlockAudio();
    });

    // 4. On visibility change
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        setTimeout(unlockAudio, 200);
      }
    });

    // 5. OBS specific - try every 2 seconds for first 10 seconds
    let obsRetryCount = 0;
    const obsRetryInterval = setInterval(() => {
      if (obsRetryCount < 5) {
        unlockAudio();
        obsRetryCount++;
      } else {
        clearInterval(obsRetryInterval);
      }
    }, 2000);

    // 6. If in iframe (OBS), try to trigger via postMessage
    if (window.frameElement) {
      console.log('📺 Running in OBS iframe');
      // Try to request user interaction
      window.parent.postMessage('requestAudio', '*');
    }

    // 7. MutationObserver - play when DOM changes
    const observer = new MutationObserver(() => {
      if (audioPlayer.src && audioPlayer.paused) {
        unlockAudio();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Start connection
    connect();

    console.log('🎵 Audio player ready with ultimate autoplay fix');
  </script>
</body>
</html>
