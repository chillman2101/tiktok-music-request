<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Song Request Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #panel {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 380px;
  }
  .now-playing {
    background: linear-gradient(135deg, rgba(35, 30, 38, 0.7), rgba(18, 16, 20, 0.75));
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 3px solid #ff2d55;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 45, 85, 0.05) inset;
    animation: slideIn 0.4s ease;
  }
  .now-playing .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .now-playing .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ff2d55;
    font-weight: 700;
  }
  .now-playing .requester-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 45, 85, 0.15);
    border: 1px solid rgba(255, 45, 85, 0.4);
    border-radius: 999px;
    padding: 3px 10px 3px 6px;
  }
  .now-playing .requester-badge .avatar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ff2d55;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .now-playing .requester-badge .name {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .now-playing .title {
    font-size: 19px;
    font-weight: 700;
    margin-top: 6px;
  }
  .now-playing .artist {
    font-size: 13px;
    color: #ccc;
  }
  .now-playing .status {
    font-size: 11px;
    color: #4caf50;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .now-playing .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4caf50;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  #audio-player {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    z-index: -999;
  }
  
  .queue-item {
    background: rgba(20, 18, 22, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 7px 12px;
    margin-bottom: 4px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideIn 0.3s ease;
  }
  .queue-item .song-info { display: flex; align-items: center; min-width: 0; }
  .queue-item .pos { color: #888; margin-right: 8px; flex-shrink: 0; }
  .queue-item .song-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .queue-item .requester {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255, 45, 85, 0.18);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .empty {
    font-size: 13px;
    color: #999;
    font-style: italic;
  }

  /* Lyrics panel — synced lines from LRCLIB, shown while a song plays */
  #lyrics-panel {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, 80vw);
    text-align: center;
    pointer-events: none;
  }
  #lyrics-panel .line {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.35);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    transition: color 0.3s ease, font-size 0.3s ease, transform 0.3s ease;
    padding: 2px 0;
  }
  #lyrics-panel .line.current {
    font-size: 21px;
    font-weight: 700;
    color: #fff;
    transform: scale(1.02);
  }

  /* Comment bubbles — non-command chat, floats up and fades */
  #bubble-layer {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 320px;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  .comment-bubble {
    background: rgba(20, 18, 22, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    color: #eee;
    max-width: 100%;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    animation: bubbleIn 0.35s ease, bubbleOut 0.4s ease 4.6s forwards;
  }
  .comment-bubble .username {
    color: #ff5c85;
    font-weight: 700;
    margin-right: 6px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bubbleOut {
    from { opacity: 1; }
    to { opacity: 0; transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <div id="panel">
    <div id="content"><div class="empty">Belum ada request lagu...</div></div>
  </div>

  <div id="lyrics-panel"></div>
  <div id="bubble-layer"></div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    const content = document.getElementById('content');
    const audioPlayer = document.getElementById('audio-player');
    const lyricsPanel = document.getElementById('lyrics-panel');
    const bubbleLayer = document.getElementById('bubble-layer');
    let currentSong = null;
    let isPlaying = false;
    let audioContext = null;

    // Auth token
    const authToken = new URLSearchParams(location.search).get('key') || '';

    // === ULTIMATE AUTOPLAY FIX ===
    function unlockAudio() {
      // Method 1: Create silent AudioContext to unlock audio
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          // Create silent buffer and play it
          const buffer = audioContext.createBuffer(1, 1, 22050);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start(0);
          console.log('✅ AudioContext unlocked');
        }
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume().then(() => {
            console.log('✅ AudioContext resumed');
          });
        }
      } catch (e) {
        console.log('AudioContext error:', e);
      }

      // Method 2: Try to play audio element
      if (audioPlayer.src && audioPlayer.paused) {
        audioPlayer.muted = true;
        audioPlayer.play().then(() => {
          audioPlayer.muted = false;
          isPlaying = true;
          console.log('✅ Audio playing (unlocked)');
        }).catch(() => {
          // Method 3: Fallback - reload and try again
          audioPlayer.load();
          setTimeout(() => {
            audioPlayer.muted = true;
            audioPlayer.play().then(() => {
              audioPlayer.muted = false;
              isPlaying = true;
              console.log('✅ Audio playing (reloaded)');
            }).catch(() => {});
          }, 500);
        });
      }
    }

    function playAudio(videoId) {
      if (!videoId) return;
      
      const baseUrl = `${window.location.protocol}//${window.location.host}`;
      const streamUrl = `${baseUrl}/api/stream?videoId=${videoId}&key=${encodeURIComponent(authToken)}`;
      
      // Set source
      audioPlayer.src = streamUrl;
      audioPlayer.load();
      
      // Unlock and play
      setTimeout(() => {
        unlockAudio();
      }, 200);
      
      // Auto-advance when song ends
      audioPlayer.onended = () => {
        console.log('⏭️ Song ended, advancing...');
        isPlaying = false;
        fetch(`/api/advance?key=${encodeURIComponent(authToken)}`, { method: 'POST' })
          .catch(() => {});
      };
      
      // Handle errors
      audioPlayer.onerror = (e) => {
        console.error('❌ Audio error:', e);
        setTimeout(() => {
          if (!isPlaying) {
            unlockAudio();
          }
        }, 1000);
      };
    }

    function render(queue) {
      if (!queue || queue.length === 0) {
        content.innerHTML = '<div class="empty">Belum ada request lagu... ketik !play judul lagu</div>';
        audioPlayer.pause();
        audioPlayer.src = '';
        isPlaying = false;
        lyricsPanel.innerHTML = '';
        lyricsSongKey = null;
        lyricLines = [];
        return;
      }

      const [current, ...upNext] = queue;
      currentSong = current;
      loadLyrics(current);

      const currentRequester = current.requestedBy || '';
      let html = `
        <div class="now-playing">
          <div class="top-row">
            <div class="label">🎵 Now Playing</div>
            ${currentRequester ? `
              <div class="requester-badge">
                <span class="avatar">${escapeHtml(currentRequester.charAt(0).toUpperCase())}</span>
                <span class="name">@${escapeHtml(currentRequester)}</span>
              </div>
            ` : ''}
          </div>
          <div class="title">${escapeHtml(current.title)}</div>
          <div class="artist">${escapeHtml(current.artist)}</div>
          <div class="status">
            <span class="dot"></span>
            Streaming from server
          </div>
        </div>
      `;

      upNext.slice(0, 5).forEach((song, i) => {
        html += `
          <div class="queue-item">
            <span class="song-info"><span class="pos">#${i + 1}</span><span class="song-text">${escapeHtml(song.title)} — ${escapeHtml(song.artist)}</span></span>
            <span class="requester">👤 @${escapeHtml(song.requestedBy)}</span>
          </div>
        `;
      });

      content.innerHTML = html;

      // Play audio if videoId exists
      if (current.videoId) {
        const currentSrc = audioPlayer.src;
        const newSrc = `${window.location.protocol}//${window.location.host}/api/stream?videoId=${current.videoId}&key=${encodeURIComponent(authToken)}`;
        
        if (!currentSrc.includes(current.videoId) || audioPlayer.paused) {
          playAudio(current.videoId);
        }
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    // === Lyrics (LRCLIB, synced to audioPlayer.currentTime) ===
    let lyricLines = [];
    let lyricsSongKey = null;

    async function loadLyrics(song) {
      const key = `${song.title}|${song.artist}`;
      if (key === lyricsSongKey) return;
      lyricsSongKey = key;
      lyricLines = [];
      lyricsPanel.innerHTML = '';
      delete lyricsPanel.dataset.line;

      try {
        const url = `/api/lyrics?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}&key=${encodeURIComponent(authToken)}`;
        const res = await fetch(url);
        if (!res.ok) {
          console.warn(`🎤 Lyrics fetch failed (${res.status}) for "${song.title}" by "${song.artist}"`);
          return;
        }
        const data = await res.json();
        lyricLines = data.lines || [];
        console.log(`🎤 Loaded ${lyricLines.length} lyric lines for "${song.title}"`);
        if (lyricLines.length === 0) {
          console.log('🎤 No synced lyrics found on LRCLIB for this song.');
        }
      } catch (e) {
        console.warn('🎤 Lyrics fetch error:', e);
      }
    }

    function updateLyricsDisplay() {
      if (lyricLines.length === 0) return;
      const t = audioPlayer.currentTime;

      let idx = -1;
      for (let i = 0; i < lyricLines.length; i++) {
        if (lyricLines[i].time <= t) idx = i;
        else break;
      }
      if (idx === -1) return;

      const current = lyricLines[idx];
      const next = lyricLines[idx + 1];
      if (lyricsPanel.dataset.line === String(idx)) return;
      lyricsPanel.dataset.line = String(idx);

      lyricsPanel.innerHTML = `
        <div class="line current">${escapeHtml(current.text)}</div>
        ${next ? `<div class="line">${escapeHtml(next.text)}</div>` : ''}
      `;
    }

    audioPlayer.addEventListener('timeupdate', updateLyricsDisplay);

    // === Comment bubbles (non-command chat) ===
    function showCommentBubble(username, comment) {
      const bubble = document.createElement('div');
      bubble.className = 'comment-bubble';
      bubble.innerHTML = `<span class="username">@${escapeHtml(username)}</span>${escapeHtml(comment)}`;
      bubbleLayer.appendChild(bubble);

      // Cap how many bubbles pile up on screen at once
      while (bubbleLayer.children.length > 6) {
        bubbleLayer.removeChild(bubbleLayer.firstChild);
      }

      setTimeout(() => bubble.remove(), 5100);
    }

    function connect() {
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProtocol}//${location.host}/ws?key=${encodeURIComponent(authToken)}`);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'comment') {
          showCommentBubble(data.username, data.comment);
          return;
        }
        // Default/legacy shape (and type === 'queue'): a queue update.
        render(data.queue);
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };
    }

    // === MULTIPLE AUTOPLAY TRIGGERS ===

    // 1. On load
    window.addEventListener('load', () => {
      console.log('📄 Page loaded');
      setTimeout(unlockAudio, 300);
    });

    // 2. On click anywhere
    document.addEventListener('click', () => {
      unlockAudio();
    });

    // 3. On touch
    document.addEventListener('touchstart', () => {
      unlockAudio();
    });

    // 4. On visibility change
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        setTimeout(unlockAudio, 200);
      }
    });

    // 5. OBS specific - try every 2 seconds for first 10 seconds
    let obsRetryCount = 0;
    const obsRetryInterval = setInterval(() => {
      if (obsRetryCount < 5) {
        unlockAudio();
        obsRetryCount++;
      } else {
        clearInterval(obsRetryInterval);
      }
    }, 2000);

    // 6. If in iframe (OBS), try to trigger via postMessage
    if (window.frameElement) {
      console.log('📺 Running in OBS iframe');
      // Try to request user interaction
      window.parent.postMessage('requestAudio', '*');
    }

    // 7. MutationObserver - play when DOM changes
    const observer = new MutationObserver(() => {
      if (audioPlayer.src && audioPlayer.paused) {
        unlockAudio();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Start connection
    connect();

    console.log('🎵 Audio player ready with ultimate autoplay fix');
  </script>
</body>
</html>
