<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Song Request Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #eee;
    padding: 24px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: #ff2d55; }
  .card {
    background: #1b1b1b;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0d0d0d;
    color: #eee;
    font-size: 14px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }
  .toggle-row span { font-size: 13px; }
  button {
    background: #ff2d55;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: #333; }
  button.reject { background: #444; }
  .status { font-size: 12px; color: #4caf50; margin-top: 8px; min-height: 16px; }
  .pending-item {
    background: #0d0d0d;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .pending-item .info { min-width: 0; }
  .pending-item .title { font-size: 14px; font-weight: 600; }
  .pending-item .meta { font-size: 12px; color: #999; }
  .pending-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pending-item .actions button { margin: 0; padding: 6px 12px; }
  .empty { font-size: 13px; color: #888; font-style: italic; }
  .now-playing-card {
    background: #0d0d0d;
    border-left: 3px solid #ff2d55;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .now-playing-card .title { font-size: 14px; font-weight: 600; }
  .now-playing-card .meta { font-size: 12px; color: #999; }
  .queue-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .queue-actions button { margin: 0; padding: 7px 14px; }
  .queue-item {
    background: #0d0d0d;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: grab;
    border: 1px solid transparent;
  }
  .queue-item .handle { color: #555; font-size: 14px; margin-right: 6px; cursor: grab; }
  .queue-item .pos { color: #666; font-size: 12px; margin-right: 6px; }
  .queue-item .title { font-size: 13px; font-weight: 600; }
  .queue-item .meta { font-size: 11px; color: #999; }
  .queue-item button {
    margin: 0; padding: 5px 10px; background: #444; font-size: 12px;
  }
  .queue-item.dragging { opacity: 0.4; }
  .queue-item.drag-over { border-color: #ff2d55; }
  /* Simple toggle switch */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #333; border-radius: 22px; transition: 0.2s;
  }
  .slider::before {
    position: absolute; content: ""; height: 16px; width: 16px;
    left: 3px; bottom: 3px; background: #eee; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: #ff2d55; }
  input:checked + .slider::before { transform: translateX(18px); }
</style>
</head>
<body>
  <h1>🎛️ Song Request Admin</h1>

  <div class="card">
    <h2 style="margin-top:0">Pengaturan</h2>
    <label for="broadcaster">Broadcaster username (TikTok, buat izin !skip/!clearqueue)</label>
    <input type="text" id="broadcaster" placeholder="nama_tiktok_kamu" />

    <label for="tiktok">TikTok username yang di-watch live-nya</label>
    <input type="text" id="tiktok" placeholder="nama_tiktok_kamu" />

    <div class="toggle-row">
      <span>Auto-approve request (!play langsung masuk queue)</span>
      <label class="switch">
        <input type="checkbox" id="autoApprove" />
        <span class="slider"></span>
      </label>
    </div>

    <button id="save">Simpan</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Menunggu approval</h2>
    <div id="pendingList"><div class="empty">Memuat...</div></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Sedang diputar & antrian</h2>

    <label for="addQuery">Tambah lagu manual (judul / artis)</label>
    <div style="display:flex; gap:8px; margin-top:4px;">
      <input type="text" id="addQuery" placeholder="Payung Teduh - Akad" style="flex:1;" />
      <button id="addBtn" style="margin:0; white-space:nowrap;">➕ Tambah</button>
    </div>
    <div class="status" id="addStatus"></div>

    <div id="nowPlaying" style="margin-top:14px;"><div class="empty">Memuat...</div></div>
    <div class="queue-actions">
      <button id="skipBtn" class="secondary">⏭ Skip</button>
      <button id="clearBtn" class="reject">🗑 Clear semua</button>
    </div>
    <div id="queueList"></div>
  </div>

  <script>
    const authToken = new URLSearchParams(location.search).get('key') || '';
    const qs = `?key=${encodeURIComponent(authToken)}`;

    const broadcasterInput = document.getElementById('broadcaster');
    const tiktokInput = document.getElementById('tiktok');
    const autoApproveInput = document.getElementById('autoApprove');
    const saveStatus = document.getElementById('saveStatus');
    const pendingList = document.getElementById('pendingList');

    async function loadConfig() {
      const res = await fetch(`/api/config${qs}`);
      if (!res.ok) {
        saveStatus.textContent = 'Gagal load config (token salah?)';
        saveStatus.style.color = '#f55';
        return;
      }
      const cfg = await res.json();
      broadcasterInput.value = cfg.broadcasterUsername || '';
      tiktokInput.value = cfg.tiktokUsername || '';
      autoApproveInput.checked = !!cfg.autoApprove;
    }

    document.getElementById('save').addEventListener('click', async () => {
      saveStatus.textContent = 'Menyimpan...';
      saveStatus.style.color = '#999';
      const res = await fetch(`/api/config${qs}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          broadcasterUsername: broadcasterInput.value.trim(),
          tiktokUsername: tiktokInput.value.trim(),
          autoApprove: autoApproveInput.checked,
        }),
      });
      if (res.ok) {
        saveStatus.textContent = '✅ Tersimpan';
        saveStatus.style.color = '#4caf50';
      } else {
        saveStatus.textContent = '❌ Gagal simpan';
        saveStatus.style.color = '#f55';
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    async function loadPending() {
      const res = await fetch(`/api/pending${qs}`);
      if (!res.ok) return;
      const data = await res.json();
      const items = data.pending || [];
      if (items.length === 0) {
        pendingList.innerHTML = '<div class="empty">Nggak ada yang nunggu approval</div>';
        return;
      }
      pendingList.innerHTML = items.map(s => `
        <div class="pending-item">
          <div class="info">
            <div class="title">${escapeHtml(s.title)} — ${escapeHtml(s.artist)}</div>
            <div class="meta">diminta oleh @${escapeHtml(s.requestedBy)}</div>
          </div>
          <div class="actions">
            <button data-action="approve" data-id="${escapeHtml(s.id)}">✅ Approve</button>
            <button class="reject" data-action="reject" data-id="${escapeHtml(s.id)}">✖ Tolak</button>
          </div>
        </div>
      `).join('');
    }

    pendingList.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      btn.disabled = true;
      await fetch(`/api/pending/${encodeURIComponent(id)}/${action}${qs}`, { method: 'POST' });
      loadPending();
    });

    // === Now playing + queue ===
    const nowPlayingEl = document.getElementById('nowPlaying');
    const queueListEl = document.getElementById('queueList');
    const addQueryInput = document.getElementById('addQuery');
    const addStatus = document.getElementById('addStatus');

    async function addSong() {
      const query = addQueryInput.value.trim();
      if (!query) return;
      addStatus.textContent = 'Mencari...';
      addStatus.style.color = '#999';
      const res = await fetch(`/api/admin/add${qs}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      if (res.ok) {
        const song = await res.json();
        addStatus.textContent = `✅ Ditambahkan: ${song.title} — ${song.artist}`;
        addStatus.style.color = '#4caf50';
        addQueryInput.value = '';
        loadQueue();
      } else {
        addStatus.textContent = '❌ Lagu nggak ketemu / gagal ditambahkan';
        addStatus.style.color = '#f55';
      }
    }

    document.getElementById('addBtn').addEventListener('click', addSong);
    addQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addSong();
    });

    async function loadQueue() {
      if (queuePollSuspended) return;
      const res = await fetch(`/api/admin/queue${qs}`);
      if (!res.ok) return;
      const data = await res.json();
      const status = data.status || {};
      const items = data.queue || [];

      if (status.isPlaying && status.currentSong) {
        const s = status.currentSong;
        nowPlayingEl.innerHTML = `
          <div class="now-playing-card">
            <div>
              <div class="title">🎵 ${escapeHtml(s.title)} — ${escapeHtml(s.artist)}</div>
              <div class="meta">diminta oleh @${escapeHtml(s.requestedBy)}</div>
            </div>
          </div>
        `;
      } else {
        nowPlayingEl.innerHTML = '<div class="empty">Nggak ada yang lagi diputar</div>';
      }

      // items[0] is the currently playing song (same one shown above) —
      // skip it here so the list below only shows what's queued next.
      const upNext = status.isPlaying ? items.slice(1) : items;
      if (upNext.length === 0) {
        queueListEl.innerHTML = '<div class="empty">Antrian kosong</div>';
        return;
      }
      queueListEl.innerHTML = upNext.map((s, i) => `
        <div class="queue-item" draggable="true" data-id="${escapeHtml(s.id)}">
          <div>
            <span class="handle">⠿</span>
            <span class="pos">#${i + 1}</span>
            <span class="title">${escapeHtml(s.title)} — ${escapeHtml(s.artist)}</span>
            <div class="meta">@${escapeHtml(s.requestedBy)}</div>
          </div>
          <button data-remove-id="${escapeHtml(s.id)}">✖ Hapus</button>
        </div>
      `).join('');
    }

    // === Drag-to-reorder (native HTML5 drag & drop) ===
    let draggedEl = null;
    let queuePollSuspended = false;

    queueListEl.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.queue-item');
      if (!item) return;
      draggedEl = item;
      queuePollSuspended = true;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    queueListEl.addEventListener('dragend', () => {
      if (draggedEl) draggedEl.classList.remove('dragging');
      queueListEl.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      draggedEl = null;
      queuePollSuspended = false;
    });

    queueListEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      const target = e.target.closest('.queue-item');
      if (!target || target === draggedEl) return;
      queueListEl.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      target.classList.add('drag-over');
    });

    queueListEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      const target = e.target.closest('.queue-item');
      target?.classList.remove('drag-over');
      if (!target || !draggedEl || target === draggedEl) return;

      const rect = target.getBoundingClientRect();
      const insertAfter = (e.clientY - rect.top) > rect.height / 2;
      target.insertAdjacentElement(insertAfter ? 'afterend' : 'beforebegin', draggedEl);

      const ids = [...queueListEl.querySelectorAll('.queue-item')].map(el => el.dataset.id);
      await fetch(`/api/admin/queue/reorder${qs}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids }),
      });
      loadQueue();
    });

    document.getElementById('skipBtn').addEventListener('click', async () => {
      await fetch(`/api/admin/skip${qs}`, { method: 'POST' });
      loadQueue();
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('Hapus semua antrian dan stop lagu yang lagi diputar?')) return;
      await fetch(`/api/admin/clear${qs}`, { method: 'POST' });
      loadQueue();
    });

    queueListEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-remove-id]');
      if (!btn) return;
      btn.disabled = true;
      await fetch(`/api/admin/queue/${encodeURIComponent(btn.dataset.removeId)}/remove${qs}`, { method: 'POST' });
      loadQueue();
    });

    loadConfig();
    loadPending();
    loadQueue();
    setInterval(loadPending, 3000);
    setInterval(loadQueue, 3000);
  </script>
</body>
</html>
